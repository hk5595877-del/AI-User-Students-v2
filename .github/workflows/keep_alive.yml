name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 4 hours (At minute 0 of every 4th hour)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App URL
        run: |
          curl -I https://streamlit.app
