# Privacy Policy

**StudentGPA AI**

**Effective Date:** 2026

StudentGPA AI ("the Application") is an educational software
application designed to provide GPA predictions and academic
insights based on information entered or uploaded by users.

This Privacy Policy explains what information may be collected,
how it may be used, and the services involved in operating the
Application.

---

## 1. Information We May Collect

Depending on how the Application is used, the following information
may be processed:

### Account Information

When an account is created, the Application may process:

- Full name or institute name
- Email address
- Authentication information required to maintain the account

### Prediction Information

Users may provide academic or study-related information such as:

- GPA or academic percentage
- Year/class of study
- Major/category
- Study hours
- Generative AI usage
- AI-related study information
- Other fields required by the prediction interface

Institute users may additionally upload student information through
supported CSV prediction functionality.

### Analytics Information

The Application may use Google Analytics or similar analytics
technology to understand general application usage, such as:

- Application events
- Feature usage
- General traffic information
- Device/browser information
- Approximate geographic information provided by analytics services

Analytics information is used to understand and improve the
Application.

---

## 2. How Information Is Used

Information processed by StudentGPA AI may be used to:

- Create and authenticate user accounts
- Provide GPA predictions
- Provide academic guidance
- Process institute batch predictions
- Improve application functionality
- Monitor application usage
- Diagnose technical problems
- Improve user experience
- Maintain application security

StudentGPA AI does not represent its predictions as official academic
grades or guaranteed academic outcomes.

---

## 3. Machine Learning Predictions

Information entered into the Application may be processed by the
machine-learning prediction system.

The prediction system is intended to provide estimates based on
the available model and input features.

Predictions may be inaccurate and should not be treated as:

- Official university grades
- Admissions decisions
- Scholarship decisions
- Academic disciplinary decisions
- Professional educational advice

Users should independently verify important academic decisions.

---

## 4. Institute Batch Uploads

Institute users may upload CSV files containing information about
multiple students.

Institute users are responsible for ensuring that they have the
necessary authority and permission to provide such information to
the Application.

Users should avoid uploading unnecessary personally identifiable
information.

StudentGPA AI should not be used to upload sensitive personal
information unless the Application specifically states that such
information is supported and appropriate safeguards are in place.

---

## 5. Third-Party Services

StudentGPA AI may use third-party services to operate the Application,
including:

- Supabase for authentication and related application services
- Google Analytics for application analytics
- Streamlit Community Cloud for application hosting
- Other third-party infrastructure or services required to operate
  the Application

These third-party services have their own privacy policies and terms.

StudentGPA AI does not control the privacy practices of third-party
service providers.

---

## 6. Data Security

Reasonable technical and organizational measures should be used to
protect information processed through the Application.

However, no internet-based service can guarantee absolute security.

Users should avoid submitting information that is unnecessary for
using the Application.

---

## 7. Data Retention

Information may be retained for as long as necessary to provide the
Application, maintain accounts, operate analytics, comply with legal
requirements, resolve disputes, or maintain legitimate business
records.

Specific retention periods may vary depending on the type of
information and the service processing it.

---

## 8. Data Deletion

Users may request deletion of their account or applicable personal
information by contacting the Application operator.

Requests may be subject to verification and applicable legal
requirements.

Third-party services may retain information according to their own
retention policies.

---

## 9. Children's Privacy

StudentGPA AI is not intentionally designed to collect personal
information from children in violation of applicable privacy laws.

Users should use the Application only where they are legally
permitted to do so.

Institutions are responsible for ensuring that their use of the
Application complies with applicable requirements concerning
students and minors.

---

## 10. Third-Party Dataset

The machine-learning system uses the AI Student Impact Dataset,
which is identified on its Kaggle source page as CC0 / Public Domain.

The dataset is a third-party resource and is not claimed as an
original personal-data collection by StudentGPA AI.

Source:

https://www.kaggle.com/datasets/pavankatroth/ai-student-impact-dataset

---

## 11. Changes to This Privacy Policy

This Privacy Policy may be updated when the Application, services,
data practices, or applicable legal requirements change.

The updated version will be published through the Application or
its associated repository/website.

